<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hal</title>
<style>
:root { color-scheme: dark; --bg: #16181c; --fg: #d8dade; --dim: #7d828c; --accent: #8ab4f8; --err: #f28b82; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body, textarea, input, button { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body { display: flex; flex-direction: column; }
main { flex: 1; overflow-y: auto; padding: 1rem; }
main > div { max-width: 60rem; margin: 0 auto 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt { color: var(--accent); }
.prompt::before { content: "> "; }
.thinking, .result, .end { color: var(--dim); }
.tool { color: #c3a6ff; }
.error { color: var(--err); }
footer { padding: 0.5rem 1rem 1rem; }
footer > * { display: block; max-width: 60rem; margin: 0 auto; }
#notice { color: var(--dim); min-height: 1.5em; }
textarea, input { width: 100%; background: #1f2227; color: var(--fg); border: 1px solid #33373e; border-radius: 6px; padding: 0.5rem 0.6rem; resize: none; outline: none; }
textarea:focus, input:focus { border-color: var(--accent); }
form { max-width: 20rem; margin: 20vh auto; display: flex; flex-direction: column; gap: 0.6rem; }
button { background: #2b3a55; color: var(--fg); border: 0; border-radius: 6px; padding: 0.5rem; cursor: pointer; }
</style>
</head>
<body>
<script>/*APP*/</script>
</body>
</html>
