<!doctype html>
<html lang="en" class="page" data-version="/*VERSION*/">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>Hal</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<style>
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('/fonts/IBMPlexMono-Light.woff2') format('woff2');
				font-weight: 300;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('/fonts/IBMPlexMono-LightItalic.woff2') format('woff2');
				font-weight: 300;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('/fonts/IBMPlexMono-Medium.woff2') format('woff2');
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'IBM Plex Mono';
				src: url('/fonts/IBMPlexMono-MediumItalic.woff2') format('woff2');
				font-weight: 500;
				font-style: italic;
				font-display: swap;
			}
			/* The one stylesheet: layout only. Colors come from the theme below
   (src/common/colors.ts; .page carries the page's own as variables). */
			/* --snap-ms: a frequent change (typing starts: 3 frames at 60 Hz);
   --back-ms: its rare reverse (the box empties again). */
			:root {
				color-scheme: dark;
				--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
				--fade-ms: 300ms;
				--toggle-ms: 250ms;
				--snap-ms: 50ms;
				--back-ms: 300ms;
			}
			/* Icons (icons.ts): one stroke width, in 24-grid units, for both grids. */
			:root {
				--icon-stroke: 1.5;
			}
			.icon {
				width: 1.25em;
				height: 1.25em;
				flex: none;
				fill: currentColor;
				vertical-align: -0.3em;
			}
			.icon .s {
				fill: none;
				stroke: currentColor;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-width: calc(var(--icon-stroke) * 256 / 24);
			}
			.icon.g24 .s {
				stroke-width: var(--icon-stroke);
			}
			button:has(> .icon) {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.75ch;
			}
			* {
				box-sizing: border-box;
			}
			/* Selection is reverse video in the text's own color (each theme class
   sets --sel-back, as does each rule that recolors text); a solid block
   (bg in its color) reverses back. */
			.page {
				--sel-text: var(--canvas);
			}
			::selection {
				background-color: var(--sel-back);
				color: var(--sel-text);
				-webkit-text-fill-color: var(--sel-text);
			}
			.Question button[aria-pressed='true'],
			.Question mark,
			.Card.question mark {
				--sel-back: var(--canvas);
				--sel-text: var(--fg);
			}
			/* Focus: one style, 1px in the control's own color, outside it. Inside
   where a clipping strip or list would cut it off; flush against a
   control that already draws a border, so it reads as a thicker one. */
			:where(:focus-visible) {
				outline: 1px solid currentColor;
				outline-offset: 2px;
			}
			html {
				background: var(--canvas);
				color: var(--text);
				overscroll-behavior: none;
				-webkit-text-size-adjust: 100%;
				text-size-adjust: 100%;
			}
			html,
			body {
				margin: 0;
			}
			/* iOS 26+ blurs whatever sits under the status bar of Home Screen
   apps. A fixed strip there in the page color makes WebKit skip the
   blur; text clipping keeps it unpainted over content. */
			.status-bar {
				display: none;
			}
			@supports (-webkit-touch-callout: none) {
				@media (display-mode: standalone), (display-mode: fullscreen) {
					.status-bar {
						display: block;
						position: fixed;
						inset: 0 0 auto;
						height: 11px;
						background-color: var(--canvas);
						-webkit-background-clip: text;
						background-clip: text;
						z-index: 35;
					}
				}
			}
			/* The document is 1px taller than the screen and rests scrolled 1px
   down: iOS answers a status-bar tap by scrolling it to 0, which
   viewport.statusTap turns into scrolling the transcript to the top.
   The app is fixed, so this 1px never moves it. */
			html {
				overflow-x: hidden;
				overflow-y: auto;
				scrollbar-width: none;
			}
			html::-webkit-scrollbar {
				display: none;
			}
			/* Keep the document geometry still while Safari pans its visual viewport
   for the focused field. Move the app, not a fixed body whose layout top
   changes underneath Safari's focus scrolling. */
			body {
				height: calc(100dvh + 1px);
				overflow: hidden;
			}
			body,
			textarea,
			input,
			button {
				font:
					300 14px/1.5 'IBM Plex Mono',
					monospace;
				font-synthesis: none;
			}
			body,
			textarea {
				tab-size: 4;
			}
			.App,
			.Chat {
				height: 100%;
				min-height: 0;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}
			.App {
				position: fixed;
				top: 0;
				left: 0;
				width: var(--app-width, 100%);
				max-width: 100%;
				height: var(--app-height, 100dvh);
				transform: translate(var(--app-left, 0px), var(--app-top, 0px));
			}
			/* While typing, the keyboard's panning is handled by viewport.page, so
   the old locked layout returns: no document scroll, app absolute. */
			html.typing {
				overflow: hidden;
			}
			html.typing body {
				height: 100dvh;
			}
			html.typing .App {
				position: absolute;
			}
			/* The keyboard closing: the app grows on an S curve in 360 ms (viewport.ts). */
			@media (prefers-reduced-motion: no-preference) {
				html.easing .App {
					transition:
						height 360ms cubic-bezier(0.65, 0, 0.35, 1),
						transform 360ms cubic-bezier(0.65, 0, 0.35, 1);
				}
				html.easing .Composer {
					transition: padding-bottom 360ms cubic-bezier(0.65, 0, 0.35, 1);
				}
			}
			/* Zero-height anchor: reload floats over text without moving it. */
			.source-update {
				position: relative;
				flex: none;
				height: 0;
				z-index: 2;
				pointer-events: none;
			}
			.source-update button {
				position: absolute;
				top: 4px;
				right: max(1ch, env(safe-area-inset-right));
				pointer-events: auto;
				font-size: 16px;
				line-height: 1;
				min-height: 44px;
				min-width: 44px;
				padding: 4px 8px;
				border: 0;
				color: var(--text);
				background: color-mix(in oklab, var(--overlay-bg) 75%, transparent);
			}
			/* Safe areas: viewport-fit=cover makes env(safe-area-inset-*) real (it
   is 0 without it, yet iOS still draws the page under the rounded
   corners and home indicator), so the edge rows pad themselves. */
			.Transcript {
				flex: 1;
				min-height: 0;
				display: block;
				overflow: hidden auto;
				overscroll-behavior: contain;
				--gut: max(1ch, env(safe-area-inset-left));
				padding: 0.5lh max(1ch, env(safe-area-inset-right)) 0.5lh var(--gut);
			}
			.Transcript > .rows {
				margin-bottom: auto;
			}
			.Transcript {
				container: transcript / inline-size;
			}
			.Transcript :is(.Card, .Question) {
				--leading: 20px;
				line-height: var(--leading);
			}
			@container transcript (width > calc(102ch + 3px)) {
				.Transcript :is(.Card, .Question) {
					--leading: 22px;
				}
			}
			.Transcript .rows > * {
				margin: 0 0 0.5lh;
			}
			.Transcript > .to-bottom,
			.Transcript + .to-bottom {
				position: relative;
				flex: none;
				height: 0;
				z-index: 2;
			}
			/* The End button: a translucent circle (a pill with a count); the
   arrow and ring stay at full strength. Pressed, it scales to 0.96 and
   lights at once; released, the color fades back. */
			.to-bottom button {
				position: absolute;
				right: 8px;
				bottom: 8px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 5px;
				min-width: 44px;
				height: 44px;
				padding: 0 11px;
				border-radius: 22px;
				border: 1px solid currentColor;
				color: var(--title-fg);
				background: color-mix(in oklab, var(--canvas) 60%, transparent);
				touch-action: manipulation;
				transition:
					scale 120ms var(--ease-out),
					background-color 120ms var(--ease-out),
					color 120ms var(--ease-out);
			}
			@media (pointer: fine) {
				.to-bottom button {
					min-width: 40px;
					height: 40px;
					padding: 0 9px;
				}
			}
			.to-bottom button:is(:active, [data-activated]) {
				scale: 0.96;
				color: var(--canvas);
				background: var(--title-fg);
				transition-duration: var(--snap-ms);
			}
			.to-bottom button[data-count]::after {
				content: attr(data-count);
			}
			.to-bottom svg {
				width: 20px;
				height: 20px;
				stroke: currentColor;
				fill: none;
				stroke-width: 1.75;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			/* The Top jump's progress: a zero-height anchor under the tab strip,
   so the box floats over the transcript. It fades in from 400 to 600
   ms, so a jump that ends sooner never shows; while loading, a light
   sweeps its bottom edge in the tab's color. */
			.jump {
				position: relative;
				flex: none;
				height: 0;
				z-index: 3;
				pointer-events: none;
				--jump-color: var(--project, var(--accent));
			}
			.jump > div {
				position: absolute;
				top: 8px;
				left: 50%;
				translate: -50% 0;
				display: grid;
				align-items: center;
				height: 32px;
				padding: 0 1.5ch 0 1.25ch;
				border-left: 3px solid var(--jump-color);
				background: var(--overlay-bg);
				color: var(--title-fg);
				font-size: 12px;
				white-space: nowrap;
				overflow: hidden;
				opacity: 0;
				scale: 0.95;
				transition:
					opacity 150ms var(--ease-out),
					scale 150ms var(--ease-out);
			}
			.jump > .on {
				opacity: 1;
				scale: 1;
				transition-duration: 200ms;
				transition-delay: 400ms;
			}
			.jump i {
				position: absolute;
				left: 0;
				bottom: 0;
				width: 30%;
				height: 2px;
				background: var(--jump-color);
			}
			.jump .on i {
				animation: sweep 900ms linear infinite;
			}
			@keyframes sweep {
				from {
					translate: -100% 0;
				}
				to {
					translate: 340% 0;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.jump > div,
				.to-bottom button:is(:active, [data-activated]) {
					scale: 1;
				}
				.jump i {
					display: none;
				}
			}
			@keyframes fade-in {
				from {
					opacity: 0;
				}
			}
			/* Cards and the open question share one shape: square, a lit bar on
   the left, the style's tint behind. */
			.Card,
			.Question {
				border-left: 3px solid currentColor;
			}
			/* Shared compact insets; touch targets extend without enlarging rows. */
			.Card {
				position: relative;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				--card-inset: calc((44px - 1lh) / 4);
			}
			.Card .content {
				padding: 0.25lh 1ch var(--card-inset);
			}
			.Card.question .content {
				padding-top: calc(1lh - var(--card-inset));
			}
			.Card.tool .content,
			.Card.background-result .content {
				color: var(--output);
				--sel-back: var(--output);
			}
			.Card.thinking .content,
			.Card.thinking:not(.open) .label {
				font-style: italic;
			}
			.Card.thinking .Markdown {
				font-weight: 300;
				font-style: italic;
			}
			.Card .result-text {
				color: var(--output, inherit);
				--sel-back: var(--output, var(--fg));
			}
			.Card .result-text.error {
				background: none;
			}
			.result-output .CardHeader {
				min-height: 0;
				padding: 0;
				color: inherit;
			}
			.result-output .CardHeader.inline :is(.title, .stamp, .status) {
				padding-block: 0;
			}
			.Card .sender {
				color: var(--quiet);
				--sel-back: var(--quiet);
				margin-bottom: 0.25lh;
			}
			.Card .who {
				color: var(--title-fg);
				--sel-back: var(--title-fg);
			}
			.Card .who .call {
				color: inherit;
				text-decoration: underline;
			}
			.Card .exit {
				background: none;
			}
			.Card .change > :not(.lines) {
				white-space: pre;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.ToolPresentation {
				white-space: normal;
			}
			.ToolPresentation section + section,
			.raw-tool {
				margin-top: 0.5lh;
			}
			.ToolPresentation .path {
				overflow-wrap: anywhere;
				margin-bottom: 0.25lh;
			}
			.ToolPresentation pre,
			.raw-tool pre {
				margin: 0;
				font: inherit;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			.ToolPresentation code {
				font: inherit;
			}
			.ToolPresentation .diff {
				overflow-x: auto;
			}
			.ToolPresentation .diff > div {
				white-space: pre;
				width: max-content;
				min-width: 100%;
			}
			.ToolPresentation .add {
				color: var(--add-fg);
				--sel-back: var(--add-fg);
			}
			.ToolPresentation .del {
				color: var(--remove-fg);
				--sel-back: var(--remove-fg);
			}
			.ToolPresentation .dim {
				color: var(--quiet);
				--sel-back: var(--quiet);
			}
			.raw-tool button {
				background: none;
				color: inherit;
				padding: 0.5lh 1ch;
				min-height: 44px;
				text-decoration: underline;
			}
			/* An opened diff keeps whole lines and scrolls sideways as one box, its
   right edge fading while more is off screen, like a wide table. */
			.Card .change .lines,
			.Card .edit-diff {
				overflow-x: auto;
				mask-image: linear-gradient(to left, transparent, currentColor var(--fade));
				animation: md-fade linear both;
				animation-timeline: scroll(self inline);
			}
			.Card .change .lines > div,
			.Card .edit-diff > div {
				white-space: pre;
				width: max-content;
				min-width: 100%;
			}
			.Card .change .add,
			.Card .edit-diff .add,
			.CardHeader .status .add,
			.Markdown pre.diff .add {
				color: var(--add-fg);
				--sel-back: var(--add-fg);
			}
			.Card .change .del,
			.Card .edit-diff .del,
			.CardHeader .status .del,
			.Markdown pre.diff .del {
				color: var(--remove-fg);
				--sel-back: var(--remove-fg);
			}
			.Markdown pre.diff .add2 {
				color: var(--add2-fg);
				--sel-back: var(--add2-fg);
			}
			.Markdown pre.diff .del2 {
				color: var(--remove2-fg);
				--sel-back: var(--remove2-fg);
			}
			.Card .change .dim,
			.Card .edit-diff .dim,
			.Markdown pre.diff .dim {
				color: var(--context-fg);
				--sel-back: var(--context-fg);
			}
			/* Removed text in the rows is struck through, as in the terminal. */
			.Card .change .row.del,
			.Card .change span.del {
				text-decoration: line-through;
			}
			.Card .change .head:not(:first-child) {
				margin-top: 0.5lh;
			}
			/* Side items sit at the right of the first line, after the title in reading order; a float spacer
			   sized to them (CardHeader.tsx) lets wrapped title lines below use the full width. */
			.CardHeader {
				display: flow-root;
				padding-inline: 1ch;
			}
			/* The spacer covers only the first line, even when touch targets make the side taller. */
			.CardHeader:not(.inline)::before {
				content: '';
				float: right;
				width: var(--side-width, 0);
				height: min(var(--side-height, 0px), calc(var(--card-inset) + 1lh));
				margin-left: 1ch;
			}
			.CardHeader .side {
				position: absolute;
				top: 0;
				right: 1ch;
				display: flex;
				align-items: start;
				column-gap: 1ch;
			}
			.CardHeader .side:empty {
				display: none;
			}
			.CardHeader {
				position: relative;
				--sticky-bg: var(--card-bg, var(--canvas));
				background: color-mix(in oklab, var(--sticky-bg) 65%, transparent);
			}
			.CardHeader.inline {
				position: static;
				background: none;
				display: grid;
				grid-template-columns: auto minmax(0, 1fr);
				grid-auto-flow: column;
				align-items: start;
				column-gap: 1ch;
			}
			.CardHeader.inline :is(.flow, .side) {
				display: contents;
			}
			.CardHeader.inline .title {
				min-width: 0;
				padding-block: var(--card-inset);
			}
			.CardHeader.inline .stamp,
			.CardHeader.inline .side > * {
				position: static;
				align-self: start;
				background: color-mix(in oklab, var(--sticky-bg) 65%, transparent);
			}
			.Transcript .rows > [data-tall] .CardHeader:not(.inline),
			.Transcript .rows > [data-tall] .CardHeader.inline .stamp,
			.Transcript .rows > [data-tall] .CardHeader.inline .side > * {
				position: sticky;
				top: 0;
				z-index: 1;
			}
			/* Scroll-driven sticky shading runs only on tall cards with a fine
			   pointer: attaching view-timeline/z-index to every header promotes
			   each one into its own WebKit layer, which iOS drops mid-scroll
			   under programmatic bottom-following jumps (task gwr). */
			@media (hover: hover) and (pointer: fine) {
				@supports (animation-timeline: --sticky-card) {
					.Transcript .rows > :is(.Card, .Question)[data-tall] {
						view-timeline: --sticky-card block;
					}
					.Transcript .rows > [data-tall] .CardHeader:not(.inline),
					.Transcript .rows > [data-tall] .CardHeader.inline .stamp,
					.Transcript .rows > [data-tall] .CardHeader.inline .side > * {
						animation: sticky-shade linear both;
						animation-timeline: --sticky-card;
						animation-range: exit-crossing 20px exit-crossing 40px;
					}
				}
			}
			@keyframes sticky-shade {
				to {
					background-color: color-mix(
						in oklab,
						color-mix(in oklab, var(--sticky-bg) 80%, var(--overlay-bg)) 65%,
						transparent
					);
				}
			}
			.CardHeader.inline .stamp {
				padding-block: var(--card-inset);
			}
			.CardHeader .flow,
			.CardHeader .link,
			.CardHeader .side > .call {
				padding-block: var(--card-inset);
			}
			.CardHeader .side > .call {
				white-space: nowrap;
			}
			.CardHeader .flow {
				display: block;
				min-width: 0;
			}
			.CardHeader .stamp {
				padding: 0;
				background: none;
				color: inherit;
				font: inherit;
				white-space: nowrap;
			}
			.CardHeader .mark {
				position: relative;
			}
			@media (pointer: coarse) {
				.CardHeader .mark::after {
					content: '';
					position: absolute;
					inset: 50% auto auto 50%;
					width: max(100%, 44px);
					height: 44px;
					transform: translate(-50%, -50%);
				}
			}
			/* A flowing header (a question): time and label are one text, wrapping to the left edge. */
			.Card.folds:not(.open) .CardHeader .flow {
				display: flow-root;
				overflow: clip visible;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.CardHeader.head:not(.inline) .flow {
				overflow-x: clip;
			}
			.CardHeader.head:not(.inline) .title::after {
				content: '   open';
				display: inline-block;
				width: 0;
				white-space: pre;
				opacity: 0;
				transition: opacity 250ms ease;
			}
			.Card.open > .CardHeader.head:not(.inline) .title::after {
				content: '   close';
			}
			@media (hover: hover) and (pointer: fine) {
				.CardHeader.head:not(.inline):hover .title::after {
					opacity: 0.5;
					transition-duration: 100ms;
				}
			}
			.CardHeader .side > .peek {
				width: 0;
				margin-left: -1ch;
				display: flex;
				justify-content: flex-end;
				opacity: 0;
				transition: opacity 250ms ease;
			}
			.CardHeader .side > .peek > .status {
				padding-left: 1ch;
				background: var(--sticky-bg);
				color: color-mix(in oklab, currentColor 50%, var(--sticky-bg));
			}
			@media (hover: hover) and (pointer: fine) {
				.CardHeader:hover .side > .peek {
					opacity: 1;
					transition-duration: 100ms;
				}
			}
			/* Rebase summaries retain drop ranges, edited IDs and --paused at every width (18n). */
			.CardHeader .error {
				background: none;
				margin-left: 1ch;
			}
			/* Steering's "(canceled)" or "(stopped, 50.2s)" is no failure; a flagged call's label keeps the title color (task ker). */
			.Card .receipt {

			/* Changes window (task ahr): file list beside the diff; one pane at a

			@media (max-width: 50rem) {

			/* Tabs (tasks 3k, ce, mgs): two-tier console at all widths — card-tinted
   title header (plus new-tab on fine pointers and list/count button) on
   row 1 over a full-width scrollable number rail on row 2. Project color
   is a bottom LED bar on rail tabs and a 3px left bar on the active
   header and list rows; status is a separate round dot. */
			.Tabs {
				flex: none;
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto auto;
				padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
			}
			.Tabs .head {
				grid-column: 1;
				grid-row: 1;
				display: flex;
				align-items: stretch;
				min-width: 0;
				height: 40px;
				background: var(--project-bg, var(--button));
				border-left: 3px solid var(--project, var(--title-fg, var(--text)));
				box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--border) 22%, transparent);
			}
			.Tabs .head .title-btn {
				flex: 1;
				min-width: 0;
				height: 100%;
				display: flex;
				align-items: center;
				gap: 1ch;
				padding: 0 1.25ch 0 1ch;
				text-align: left;
				color: var(--title-fg, var(--text));
			}
			.Tabs .head .n {
				flex: none;
				color: var(--project, var(--title-fg, var(--text)));
			}
			.Tabs .head .name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.Tabs .head .head-mark {
				flex: none;
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.Tabs .head .head-dot {
				flex: none;
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: currentColor;
				color: var(--mark-lit);
			}
			.Tabs .head .head-dot.paused {
				background: transparent;
				border: 1.5px solid var(--mark-lit);
			}
			.Tabs .head .head-state {
				flex: none;
				font-size: 12px;
				color: var(--mark-lit);
				white-space: nowrap;
			}
			.Tabs .strip {
				grid-column: 1 / -1;
				grid-row: 2;
				display: flex;
				align-items: stretch;
				height: 32px;
				white-space: nowrap;
				overflow: hidden;
				container-type: inline-size;
				box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--border) 22%, transparent);
			}
			.Tabs .track {
				position: relative;
				display: flex;
				flex: 1;
				min-width: 0;
				overflow-x: auto;
				overflow-y: hidden;
				scrollbar-width: none;
				scroll-snap-type: x proximity;
				overscroll-behavior-x: contain;
				touch-action: pan-x pinch-zoom;
			}
			.Tabs .track .tab {
				scroll-snap-align: start;
			}
			/* Snap would undo the small steps that scroll a dragged tab along. */
			.Tabs .strip.dragging .track {
				scroll-snap-type: none;
			}
			.Tabs .tab {
				display: flex;
				flex: none;
				align-items: center;
				justify-content: center;
				padding: 0;
				background: none;
				text-decoration: none;
				color: var(--text);
			}
			.Tabs .face {
				display: contents;
			}
			.Tabs .strip .tab {
				position: relative;
				min-width: 38px;
				padding: 0 0.75ch;
				color: var(--text);
			}
			/* Project color on rail tabs: a bottom LED bar, separate from numbers and status. */
			.Tabs .strip .tab::before {
				content: '';
				position: absolute;
				left: 9px;
				right: 9px;
				bottom: 0;
				height: 2px;
				background: var(--project, transparent);
			}
			/* Active rail tab: subtle project tint and full-width bottom LED bar. */
			.Tabs .strip .tab[aria-current] {
				background: var(--project-bg, var(--button));
				color: var(--title-fg, var(--text));
			}
			.Tabs .strip .tab[aria-current]::before {
				left: 0;
				right: 0;
				height: 3px;
				background: var(--project, var(--title-fg, var(--text)));
			}
			.Tabs .strip .tab[data-drop]::after {
				content: '';
				position: absolute;
				top: 0;
				bottom: 0;
				width: 3px;
				background: var(--title-fg, var(--text));
			}
			.Tabs .strip .tab[data-drop='before']::after {
				left: 0;
			}
			.Tabs .strip .tab[data-drop='after']::after {
				right: 0;
			}
			/* Status dot: top-right corner on rail cells, inline in the list sheet.
   Hollow when paused; pulses in theme colors when working. */
			.Tabs .marker {

				right: 5px;
				width: 6px;
				height: 6px;

				color: var(--mark-lit);
			}
			.Tabs .strip .marker:not([aria-label]) {
				display: none;
			}
			.Tabs .marker.paused {
				background: transparent;
				border: 1.5px solid var(--mark-lit);
			}
			.Tabs .strip :focus-visible,
			.Tabs .head :focus-visible,
			.Tabs > .new:focus-visible,

			}
			.Tabs .marker.blink,
			.Tabs .head-dot.blink {
				animation: marker-blink 2s ease-in-out infinite;
			}
			.Tabs .marker.working.with-jobs,
			.Tabs .head-dot.working.with-jobs {
				--mark-alt: var(--jobs-fg);
			}
			@keyframes marker-blink {
				0%,
				100% {
					color: var(--mark-lit);

				25%,
				75% {
					color: var(--mark-dark);
				}
				50% {
					color: var(--mark-alt, var(--mark-lit));
				}
			}
			.Chat.stale .cursor-line span,

			.Tabs button {
				flex: none;
				background: transparent;
				color: inherit;

			.Tabs > .new {

				width: 18px;
				height: 18px;
				color: var(--text);
			}
			.Tabs .count .dot {
				flex: none;
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--mark-lit);
			}
			@media (hover: hover) and (pointer: fine) {
				.Tabs button:hover,

					background: color-mix(in oklab, currentColor var(--mix-hover), transparent);

			.Tabs .tab,

				touch-action: manipulation;
			}
			.Tabs .close {
				color: var(--quiet);
			}
			/* Phones and narrow panes (<= 40rem): tighter header padding and compact count. */
			@media (width <= 40rem) {
				.Tabs .head .title-btn {
					gap: 0.75ch;
					padding: 0 1ch;
				}
				.Tabs .head .head-mark.blinking .head-state,
				.Tabs .head .head-mark:not(.blinking) .head-dot {
					display: none;
				}
				.Tabs .head .head-state {

			.Tabs .sheet {

			/* The /rebase view (task bzf): a full-height modal over the app, its row
   list the one scroller; header, quick actions and footer stay put, and
   the footer rides above the phone keyboard (--app-height). */
			.Rebase {
				position: fixed;
				inset: auto;
				top: var(--app-top, 0px);
				left: var(--app-left, 0px);
				width: var(--app-width, 100vw);
				height: var(--app-height, 100dvh);
				max-width: none;
				max-height: none;
				margin: 0;
				padding: 0;
				border: 0;
				background: var(--canvas);
				color: var(--text);
				overflow: hidden;
				--gut: max(2ch, env(safe-area-inset-left));
				--gut-r: max(2ch, env(safe-area-inset-right));
			}
			.Rebase[open] {
				display: flex;
				flex-direction: column;
			}
			.Rebase::backdrop {
				background: var(--canvas);
			}
			.Rebase > .top,
			.Rebase > .quick,
			.Rebase > .foot {
				flex: none;
				padding-inline: var(--gut) var(--gut-r);
			}
			.Rebase > .top {
				display: flex;
				align-items: center;
				gap: 1ch;
				padding-top: env(safe-area-inset-top);
				border-bottom: 1px solid var(--border);
			}
			.Rebase .title {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-weight: 600;
				color: var(--accent);
			}
			.Rebase .title .id {
				color: var(--text);
			}
			.Rebase .close {
				min-width: 44px;
				min-height: 44px;
				background: transparent;
				color: inherit;
			}
			.Rebase > .quick {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.25lh 1ch;
				padding-block: 0.25lh;
			}
			.Rebase .quick input {
				width: 9ch;
				padding-block: 0;
				min-height: 36px;
			}
			.Rebase .quick button {
				min-height: 36px;
			}
			.Rebase .quick .hint {
				color: var(--quiet);
			}
			.Rebase .quick .range {
				display: none;
			}
			@media (pointer: coarse) {
				.Rebase .quick .range {
					display: inline-block;
				}
				.Rebase .quick .hint {
					display: none;
				}
				.Rebase .quick input,
				.Rebase .quick button {
					min-height: 44px;
				}
			}
			.Rebase .rows {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				overscroll-behavior: contain;
				margin: 0;
				padding: 0 var(--gut-r) 0.5lh var(--gut);
				list-style: none;
				border-top: 1px solid var(--border);
			}
			.Rebase .date {
				padding: 0.5lh 0 0 calc(3px + 1ch);
				color: var(--accent);
			}
			.Rebase .row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				column-gap: 1ch;
				border-left: 3px solid transparent;
				border-bottom: 1px solid color-mix(in oklab, currentColor var(--mix-divider), transparent);
			}
			.Rebase .row.drop,
			.Rebase .row.group {
				border-left-color: var(--remove-fg);
			}
			.Rebase .row.edit {
				border-left-color: var(--add-fg);
			}
			.Rebase .info {
				display: grid;
				grid-template-columns: 6ch 5ch 10ch 6ch 12ch minmax(0, 1fr);
				column-gap: 1ch;
				align-items: baseline;
				min-width: 0;
				min-height: 44px;
				padding: calc((44px - 1lh) / 2) 1ch;
				text-align: left;
				background: transparent;
				color: inherit;
			}
			@media (hover: hover) and (pointer: fine) {
				.Rebase .info:hover {
					background: color-mix(in oklab, currentColor var(--mix-hover), transparent);
				}
			}
			.Rebase .info:focus-visible,
			.Rebase .acts button:focus-visible {
				outline-offset: -1px;
			}
			.Rebase .info > span {
				min-width: 0;
			}
			.Rebase .n,
			.Rebase .time {
				color: var(--quiet);
			}
			.Rebase .kind,
			.Rebase .summary {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.Rebase .tokens {
				text-align: right;
				font-weight: 600;
			}
			.Rebase .bar {
				align-self: center;
				height: 0.6lh;
			}
			.Rebase .bar > span {
				display: block;
				height: 100%;
				background: currentColor;
			}
			.Rebase .carries {
				grid-column: 6;
				color: var(--quiet);
				overflow-wrap: anywhere;
			}
			.Rebase .row.drop .summary,
			.Rebase .row.group .summary {
				text-decoration: line-through;
				color: var(--remove-fg);
			}
			.Rebase .acts {
				display: flex;
				align-self: start;
			}
			.Rebase .acts button {
				min-width: 44px;
				min-height: 44px;
				padding: 0 1ch;
				background: transparent;
				color: inherit;
				box-shadow: inset 0 0 0 1px color-mix(in oklab, currentColor var(--mix-divider), transparent);
			}
			@media (hover: hover) and (pointer: fine) {
				.Rebase .acts button:hover:not(:disabled) {
					background: color-mix(in oklab, currentColor var(--mix-hover), transparent);
				}
			}
			.Rebase .acts button:disabled {
				color: var(--quiet);
				cursor: default;
				text-decoration: line-through;
			}
			.Rebase .acts .keep[aria-pressed='true'] {
				background: var(--accent);
				color: var(--canvas);
			}
			.Rebase .acts .drop[aria-pressed='true'] {
				background: var(--remove-fg);
				color: var(--canvas);
			}
			.Rebase .acts .edit[aria-pressed='true'] {
				background: var(--add-fg);
				color: var(--canvas);
			}
			.Rebase .edit:is(textarea) {
				grid-column: 1 / -1;
				margin: 0 0 0.5lh calc(3px + 1ch);
				width: calc(100% - 1ch - 3px);
				max-height: 50dvh;
				field-sizing: content;
				min-height: 3lh;
				resize: vertical;
			}
			.Rebase .detail {
				grid-column: 1 / -1;
				display: flex;
				flex-direction: column;
				gap: 0.5lh;
				padding: 0 1ch 0.5lh;
			}
			.Rebase .part pre {
				margin: 0;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				font: inherit;
			}
			.Rebase .part pre.error {
				color: var(--remove-fg);
			}
			.Rebase .part .label,
			.Rebase .part.label {
				color: var(--quiet);
			}
			.Rebase .part a {
				color: inherit;
			}
			.Rebase .part img {
				display: block;
				max-width: 100%;
				max-height: 24rem;
				margin-top: 0.25lh;
			}
			.Rebase .before {
				align-self: flex-start;
				min-height: 44px;
			}
			.Rebase > .foot {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.25lh 2ch;
				padding-block: 0.25lh max(0.5lh, env(safe-area-inset-bottom));
				border-top: 1px solid var(--border);
			}
			.Rebase .foot .error {
				flex: 1 0 100%;
				display: flex;
				align-items: flex-start;
				gap: 1ch;
				color: var(--remove-fg);
				max-height: 30dvh;
				overflow-y: auto;
			}
			.Rebase .foot .error pre {
				flex: 1;
				margin: 0;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				font: inherit;
			}
			.Rebase .foot .error button {
				min-height: 44px;
				flex: none;
			}
			.Rebase .sums {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-wrap: wrap;
				gap: 0 2ch;
			}
			.Rebase .sums span {
				white-space: nowrap;
			}
			.Rebase .sums b {
				color: var(--accent);
			}
			.Rebase .buttons {
				display: flex;
				gap: 1ch;
				margin-left: auto;
			}
			.Rebase .buttons button {
				min-height: 44px;
				padding: 0 2ch;
				font-weight: 600;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.Rebase .buttons .apply:not(:disabled) {
				background: var(--accent);
				color: var(--canvas);
			}
			.Rebase .buttons button:disabled {
				background: transparent;
				color: var(--quiet);
				box-shadow: inset 0 0 0 1px currentColor;
				cursor: default;
			}
			/* Phones: the meta on one line, the summary under it, the size bar a
   strip along the row's foot; the actions keep their 44px. */
			@media (max-width: 40rem) {
				.Rebase {
					--gut: max(1ch, env(safe-area-inset-left));
					--gut-r: max(1ch, env(safe-area-inset-right));
				}
				.Rebase .info {
					position: relative;
					grid-template-columns: auto auto minmax(0, 1fr) auto;
					padding-inline: 0.5ch;
				}
				.Rebase .summary,
				.Rebase .carries {
					grid-column: 1 / -1;
				}
				.Rebase .bar {
					position: absolute;
					left: 0;
					right: 0;
					bottom: 0;
					height: 3px;
				}
				.Rebase .acts button {
					padding: 0 0.5ch;
				}
			}
			/* A history rewrite's divider offers Undo (task z71). */
			.Card.divider .undo {
				margin-left: 1ch;
				padding: 0 1ch;
				background: transparent;
				color: inherit;
				box-shadow: inset 0 0 0 1px currentColor;
			}
			@media (pointer: coarse) {
				.Card.divider .undo {
					min-height: 44px;
					min-width: 44px;
				}
			}
			/* The theme (src/common/colors.ts), put here by the host. */
			/*COLORS*/
		</style>
	</head>
	<body>
		<!-- The browser's settings from config.ason, put here per request. -->
		<script type="application/json" id="settings">
			/*SETTINGS*/
		</script>
		<script type="application/json" id="send-keys">
			/*SEND_KEYS*/
		</script>
		<script type="application/json" id="push-key">
			/*PUSH_KEY*/
		</script>
		<script>

		</script>
	</body>
</html>
