<!doctype html>
<html lang="en" class="page" data-version="/*VERSION*/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hal</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* The one stylesheet: layout only. Colours come from the theme below
   (src/common/colors.ts; .page carries the page's own as variables). */
:root { color-scheme: dark; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --fade-ms: 300ms; --toggle-ms: 250ms; }
* { box-sizing: border-box; }
html { background: var(--canvas); color: var(--text); }
html, body { margin: 0; height: 100%; overflow: hidden; }
/* Sized and placed from the visual viewport (src/web/viewport.ts), so
   the phone keyboard never hides the composer or pans the page. */
body { position: fixed; left: 0; right: 0; top: var(--app-top, 0); height: var(--app-height, 100dvh); }
body, textarea, input, button { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.App, .Chat { height: 100%; display: flex; flex-direction: column; }
/* The one scroller: nothing inside it scrolls; long lines wrap. */
/* Safe areas: viewport-fit=cover makes env(safe-area-inset-*) real (it
   is 0 without it, yet iOS still draws the page under the rounded
   corners and home indicator), so the edge rows pad themselves. */
.Transcript { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 1rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left)); }
.Transcript > * { margin: 0 0 0.6rem; }
/* Cards and the open question share one shape: square, a lit bar on
   the left, the style's tint behind. */
.Card, .Question { border-left: 3px solid currentColor; }
.Card { padding: 0.4rem 0.7rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.Card.user::before { content: "> "; }
.Card.image::before { content: none; }
.Card.prompt::before { content: none; }
.Card .who { color: var(--quiet); margin-bottom: 0.4rem; }
.Card .who .call { color: inherit; text-decoration: underline; }
.Card .exit { background: none; }
/* A context boundary (tasks bc, vh): its text centred in a rule. */
.Card.divider { display: flex; align-items: center; gap: 1ch; border-left: none; }
.Card.divider::before, .Card.divider::after { content: ""; flex: 1; border-top: 1px solid currentColor; }
.Card.image img { display: block; max-width: 100%; max-height: 24rem; }
/* A prompt the host hasn't taken yet looks sent; only one that stays
   pending greys, after a delay, so a normal round trip shows nothing. */
.Card.user { transition: color 300ms var(--ease-out); }
.Card.pending { color: var(--quiet); transition-delay: 300ms; }
.Chat.offline .Card.pending .who::after { content: " (waiting to reconnect)"; }
.Card.folds { padding: 0; cursor: pointer; }
.Card .head { display: flex; gap: 0.6ch; width: 100%; padding: 0.4rem 0.7rem; background: none; color: inherit; text-align: left; }
.Card .head:focus-visible { outline: 1px solid currentColor; outline-offset: -2px; }
.Card .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.Card .head .error { background: none; margin-left: auto; }
/* Each card links to itself (task 0z): a # in its top right corner,
   shown on hover or focus; the linked card is outlined. */
.Card { position: relative; padding-right: 7ch; }
.Card .head { padding-right: 7ch; }
.Card > .link { position: absolute; top: 0; right: 0; padding: 0.4rem 0.7rem 0.4rem 0.5ch; color: inherit; text-decoration: none; user-select: none; color: var(--quiet); }
.Card > .link::before { content: attr(data-ref); }
.Card > .link:hover, .Card > .link:focus-visible { color: inherit; text-decoration: underline; }
.Card.target { outline: 1px solid currentColor; outline-offset: 2px; scroll-margin-top: 0.5rem; }
.Card .more { display: block; margin-top: 0.3rem; background: none; color: inherit; text-decoration: underline; padding: 0; }
@media (pointer: coarse) { .Card > .link { min-width: 44px; min-height: 44px; text-align: right; } .Card .more { min-height: 44px; } }
/* Open and close animate the height (a one-row grid, 0fr to 1fr);
   closing is faster. Padding sits inside so closed is truly 0 high. */
.Card .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows calc(var(--toggle-ms) * 0.7) var(--ease-out); }
.Card.open .body { grid-template-rows: 1fr; transition-duration: var(--toggle-ms); }
.Card .contents { min-height: 0; overflow: hidden; padding: 0 0.7rem 0 calc(0.7rem + 2ch); }
.Card .contents::after { content: ""; display: block; height: 0.4rem; }
/* Hal's cursor: inside the card that streams, right after its last
   character (dimmed while thinking), else on a line after the last
   item. */
.cursor-line { min-height: 2.5rem; padding: 0.2rem 0 0.6rem; color: var(--cursor); }
.cursor-line span, .Card .cursor { display: block; width: 1ch; height: 1lh; background: currentColor; animation: blink 1s steps(1, end) infinite; }
.Card .cursor { display: inline-block; vertical-align: text-bottom; margin-left: 0.2ch; background: var(--cursor); }
.Card.thinking .cursor { background: var(--quiet); }
.Card .head .cursor { flex: none; align-self: center; }
/* Model text as markdown (task fn). Each source line is a row, a blank
   one as tall as text; the last is inline so Hal's cursor follows it. A
   table too wide scrolls sideways in its own box, and while more of it
   is off to the right, that edge fades (a scroll-driven --fade). */
.Markdown .line { min-height: 1lh; }
.Markdown .line:has(+ .cursor) { display: inline; }
.Markdown .h { margin-top: 0.3rem; }
.Markdown .li { display: flex; }
.Markdown .li .marker { flex: none; }
.Markdown .quote { border-left: 2px solid color-mix(in oklab, currentColor var(--mix-quote), transparent); padding-left: 1ch; }
.Markdown .b { font-weight: bold; }
.Markdown .i { font-style: italic; }
.Markdown .code, .Markdown pre { font-family: ui-monospace, monospace; }
.Markdown a { color: inherit; }
.Markdown pre { margin: 0.3rem 0; white-space: pre-wrap; }
.Markdown pre[data-lang]::before { content: attr(data-lang); display: block; color: var(--quiet); }
.Markdown .table { overflow-x: auto; margin: 0.3rem 0; white-space: normal; mask-image: linear-gradient(to left, transparent, currentColor var(--fade)); animation: md-fade linear both; animation-timeline: scroll(self inline); }
.Markdown table { border-collapse: collapse; }
.Markdown th, .Markdown td { border: 1px solid color-mix(in oklab, currentColor var(--mix-table), transparent); padding: 0.15rem 0.5rem; text-align: left; vertical-align: top; overflow-wrap: normal; min-width: 6ch; }
.Markdown td { white-space: pre-line; }
@property --fade { syntax: "<length>"; inherits: false; initial-value: 0px; }
@keyframes md-fade { from { --fade: 2.5rem; } 99% { --fade: 2.5rem; } to { --fade: 0px; } }
@keyframes blink { 50% { opacity: 0; } }
/* A complete status row above the composer: on phones six groups become
   two rows of three; nothing is omitted to fit a narrow screen. */
/* The notice stack (task qm): anchored to the transcript's foot, bottom right; full width on phones. */
.Notices { position: relative; flex: none; height: 0; z-index: 2; }
.Notices .stack { position: absolute; right: max(0.5rem, env(safe-area-inset-right)); bottom: 0.5rem; width: min(24rem, calc(100vw - 1rem)); display: flex; flex-direction: column; gap: 0.3rem; }
.Notices .card { display: flex; flex-direction: column; gap: 0.1rem; padding: 0.45rem 0.7rem; border-left: 0.4rem solid; text-decoration: none; animation: notice-in 200ms var(--ease-out); }
.Notices .card.done { border-color: var(--done-fg); } .Notices .card.done strong { color: var(--done-fg); }
.Notices .card.failed { border-color: var(--failed-fg); } .Notices .card.failed strong { color: var(--failed-fg); }
.Notices .card.attention { border-color: var(--attention-fg); } .Notices .card.attention strong { color: var(--attention-fg); }
.Notices .card .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.Notices .more { align-self: flex-end; padding: 0.2rem 0.7rem; }
@media (pointer: coarse) { .Notices .card { min-height: 44px; } }
@keyframes notice-in { from { transform: translateY(0.5rem); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .Notices .card { animation: none; } }
.StatusRow { flex: none; display: flex; flex-wrap: wrap; gap: 0 2.5ch; padding: 0.2rem max(1rem, env(safe-area-inset-right)) 0.2rem max(1rem, env(safe-area-inset-left)); font-size: 0.85em; border-top: 1px solid var(--border); }
/* Whole groups flow to the next row, never breaking inside; one wider
   than the row is cut with an ellipsis (a path at its start). */
.StatusRow .group { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.StatusRow .group > span { unicode-bidi: isolate; }
@media (max-width: 40rem) { .StatusRow { padding-inline: max(0.6rem, env(safe-area-inset-left)) max(0.6rem, env(safe-area-inset-right)); } }
.Composer { position: relative; z-index: 1; flex: none; padding: 0.4rem max(1rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
.Composer > #notice:empty { display: none; }
.Composer .status { padding: 0.2rem 0; }
/* Completions: a panel in the box's own colour (the input style), like a
   card: lit left bar, outline, names bright; the selected row solid in
   that colour with canvas text, as a chosen option is. */
.Composer .completions { position: absolute; bottom: 100%; left: 0; right: 0; max-height: min(35dvh, 20rem); overflow-y: auto; background: var(--canvas); box-shadow: inset 0 0 0 1px currentColor; border-left: 3px solid currentColor; }
.Composer .completions button { display: flex; flex-direction: column; width: 100%; min-height: 44px; padding: 0.4rem 0.7rem; text-align: left; background: transparent; color: inherit; }
.Composer .completions button:hover { background: color-mix(in oklab, currentColor var(--mix-choice-hover), transparent); }
.Composer .completions button[aria-selected="true"] { background: currentColor; -webkit-text-fill-color: var(--canvas); }
.Composer .completions span { color: var(--quiet); font-size: 0.85em; }
.status .busy { color: var(--highlight); }
.status .warning, .status .error { background: none; }
.status .dot.busy { animation: pulse 1s steps(2) infinite; }
@keyframes pulse { 50% { opacity: var(--mix-pulse); } }
.entry { position: relative; display: flex; align-items: stretch; border-left: 3px solid color-mix(in oklab, currentColor var(--mix-entry), transparent); }
.entry:focus-within { border-left-color: var(--cursor); }
.entry.dropping { outline: 2px dashed var(--cursor); outline-offset: 2px; }
.entry .field { flex: 1; min-width: 0; position: relative; display: flex; }
/* The example request: the input's faint blue, as in the terminal. It
   leaves fast as typing starts and returns a little slower. */
.entry .hint { position: absolute; inset: 0.5rem 0.7rem auto; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity 150ms var(--ease-out); }
.entry .hint.gone { opacity: 0; transition-duration: 80ms; }
.entry textarea { flex: 1; min-width: 0; margin: 0; background: transparent; color: inherit; border: 0; padding: 0.5rem 0.7rem; }
.entry > button { background: transparent; color: inherit; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.5rem 1rem; border-left: 1px solid color-mix(in oklab, currentColor var(--mix-divider), transparent); transition: background-color 120ms var(--ease-out), color 150ms var(--ease-out); }
.entry > button:hover:not(:disabled) { background: color-mix(in oklab, currentColor var(--mix-hover), transparent); }
.entry > button:disabled { color: var(--quiet); cursor: default; }
.help { display: flex; flex-wrap: wrap; gap: 0 1.5ch; padding-top: 0.3rem; color: var(--description); }
.help b { color: var(--key); font-weight: 600; }
textarea, input { width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 0.6rem; resize: none; outline: none; }
textarea:focus, input:focus { border-color: var(--accent); }
.input textarea { caret-color: var(--cursor); }
button { background: var(--button); color: var(--text); border: 0; padding: 0.5rem; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--canvas); }
/* Phones: 16px fields, or iOS zooms in on focus. */
/* Touch keyboards: Enter is a newline and Send sends, so the key hints
   do not apply. */
@media (pointer: coarse) { .help { display: none; } textarea, input, .entry .hint { font-size: 16px; } }
@media (max-width: 40rem) { textarea, input, .entry .hint { font-size: 16px; } .Transcript, .Composer { padding-left: max(0.6rem, env(safe-area-inset-left)); padding-right: max(0.6rem, env(safe-area-inset-right)); } .Transcript { padding-block: 0.6rem; } }
@media (prefers-reduced-motion: reduce) { .Card .body, .entry .hint, .entry button { transition: none; } .cursor-line span, .Card .cursor, .status .dot, .Tabs .marker { animation: none; } }
.Login { max-width: 20rem; margin: 20vh auto; display: flex; flex-direction: column; gap: 0.6rem; }
.Question { position: relative; margin: 0 0 0.6rem; padding: 0.4rem 0.7rem; display: flex; flex-direction: column; gap: 0.4rem; }
/* Options: outlined in the card's colour; the chosen one solid in it,
   its text the canvas colour (text-fill keeps currentColor the card's). */
.Question button:not(.dismiss) { padding: 0.2rem 0.8rem; background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; }
.Question button[aria-pressed="true"] { background: currentColor; -webkit-text-fill-color: var(--canvas); font-weight: 600; }
.Question button:hover:not([aria-pressed="true"]) { background: color-mix(in oklab, currentColor var(--mix-choice-hover), transparent); }
/* Options wrap with the same gap across and down. */
.Question [role="group"] { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; }
.Question .dismiss { position: absolute; top: 0; right: 0; background: none; color: inherit; padding: 0.4rem 0.7rem; }
.Question .dismiss:hover { background: color-mix(in oklab, currentColor var(--mix-hover), transparent); }
.Question > .text { padding-right: 3ch; }
@media (pointer: coarse) { .Question .dismiss { min-width: 44px; min-height: 44px; } }
.Question pre.quote { margin: 0 0 0 1.5rem; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.Question mark { background: currentColor; color: var(--canvas); }
.Picker { width: min(80vw, 60rem); height: min(80vh, 50rem); background: var(--canvas); color: var(--text); border: 1px solid var(--border); padding: 0.6rem; }
.Picker[open] { display: flex; flex-direction: column; gap: 0.4rem; }
.Picker .top { display: flex; align-items: center; gap: 0.6ch; }
.Picker .title { flex: 1; min-width: 0; }
.Picker .close { background: transparent; color: inherit; padding: 0.2rem 0.6rem; }
.Picker ul { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.Picker li { padding: 0 0.4rem; cursor: pointer; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.Picker li[aria-selected="true"] { background: var(--button); }
.Picker li .match { color: var(--match); font-weight: bold; }
/* Apple HIG: touch targets at least 44x44pt. */
@media (pointer: coarse) { .Picker li { min-height: 44px; display: flex; align-items: center; } .Picker .close { min-width: 44px; min-height: 44px; } }
/* Tabs (task 3k): one row that never wraps or scrolls sideways (that
   fights the back-swipe): menu, equal cells (widths set by Tabs.tsx
   from common/tab-pages.ts), page edges, new tab. The shown tab's
   number is underlined; nothing else moves. Under 50px tall. */
.Tabs { flex: none; border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.Tabs .strip { display: flex; align-items: stretch; white-space: nowrap; overflow: hidden; }
.Tabs .pages { position: relative; flex: 1; min-width: 0; display: flex; overflow: hidden; }
.Tabs .probe { position: absolute; visibility: hidden; pointer-events: none; }
.Tabs .tab { display: flex; flex: none; align-items: center; width: var(--cell); padding: 0.3rem 0; background: none; text-decoration: none; color: var(--inactive-fg); }
.Tabs .tab .n { display: inline-block; width: calc(var(--digits) * 1ch); text-align: right; }
.Tabs .tab[aria-current] { color: var(--active-fg); }
.Tabs .tab[aria-current] .n { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; font-weight: 600; }
.Tabs .marker { display: inline-block; width: 1ch; text-align: left; }
.Tabs .strip .name { width: 12ch; margin-left: 1ch; overflow: hidden; text-overflow: ellipsis; }
.Tabs .edge { display: flex; flex: none; align-items: center; justify-content: center; width: var(--edge); padding: 0.3rem 0; text-decoration: none; color: var(--inactive-fg); }
.Tabs .edge[hidden] { display: none; }
.Tabs .marker.blink { animation: pulse 1s steps(2) infinite; }
.Tabs .marker.working { color: var(--active-fg); }
.Tabs .marker.asking, .Tabs .marker.noticed { color: var(--warning-fg); font-weight: 600; }
.Tabs .marker.paused { color: var(--paused-fg); font-weight: 600; }
.Tabs .marker.failed { color: var(--error-fg); }
.Tabs .marker.done { color: var(--done-fg); }
.Tabs button { flex: none; background: transparent; color: inherit; padding: 0.3rem 0.8rem; }
.Tabs button:hover, .Tabs .tab:hover, .Tabs .edge:hover { background: color-mix(in oklab, currentColor var(--mix-hover), transparent); }
.Tabs .menu, .Tabs .close { color: var(--inactive-fg); }
@media (pointer: coarse) { .Tabs .strip { min-height: 44px; } .Tabs button { min-width: 44px; } }
.Tabs .sheet { width: 100%; max-width: 100%; max-height: 80dvh; margin: auto 0 0; padding: 0.6rem 0.6rem max(0.6rem, env(safe-area-inset-bottom)); background: var(--canvas); color: var(--text); border: 0; border-top: 1px solid var(--border); }
.Tabs .sheet[open] { display: flex; flex-direction: column; gap: 0.4rem; }
.Tabs .sheet ul { margin: 0; padding: 0; list-style: none; overflow-y: auto; }
.Tabs .sheet li { display: flex; align-items: stretch; justify-content: space-between; }
/* The shown tab in the list is lit like a card: bar on the left, tint. */
.Tabs .sheet li:has([aria-current]) { background: color-mix(in oklab, var(--active-fg) var(--mix-tab), transparent); box-shadow: inset 3px 0 0 var(--active-fg); }
.Tabs .sheet .tab { flex: 1; width: auto; justify-content: flex-start; gap: 1ch; padding: 0.6rem; }
.Tabs .sheet .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.Tabs .sheet .close { padding: 0.6rem 1rem; }
.Tabs .sheet .new { padding: 0.6rem; background: var(--button); }
.Tabs .sheet::backdrop { background: color-mix(in oklab, var(--canvas) var(--mix-backdrop), transparent); }
/* The theme (src/common/colors.ts), put here by the host. */
/*COLORS*/
</style>
</head>
<body>
