name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The grep and glob tools shell out to ripgrep, which the runner image
      # does not preinstall.
      - run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      # ./test runs the typechecker, oxlint, and the test suite in parallel.
      - run: ./test
